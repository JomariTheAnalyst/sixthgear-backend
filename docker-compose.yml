# ============================================
# Docker Compose for Medusa v2 Backend (DEV MODE)
# ============================================
# Services:
# - redis: Cache and event bus
# - meilisearch: Search engine
# - medusa: Backend API + Admin UI (runtime mode)
#
# Database: External Supabase (not in compose)
# Frontend: External Vercel (not in compose)
# Admin UI: Served at runtime (no build step)
# ============================================

version: "3.8"

services:
  # ============================================
  # Redis - Cache & Event Bus
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: sixthgear-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - medusa-network

  # ============================================
  # Meilisearch - Search Engine
  # ============================================
  meilisearch:
    image: getmeili/meilisearch:v1.6
    container_name: sixthgear-meilisearch
    restart: unless-stopped
    ports:
      - "7700:7700"
    environment:
      # Master key for authentication (minimum 16 characters)
      - MEILI_MASTER_KEY=${MEILISEARCH_API_KEY}
      # Production environment
      - MEILI_ENV=development
      # Enable CORS for local development
      - MEILI_HTTP_CORS_ALLOW_ORIGIN=http://localhost:8000,http://localhost:9000
      # Disable analytics
      - MEILI_NO_ANALYTICS=true
    volumes:
      - meilisearch_data:/meili_data
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:7700/health",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - medusa-network

  # ============================================
  # Medusa Backend - API + Admin (DEV MODE)
  # ============================================
  medusa:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sixthgear-medusa
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    ports:
      - "9000:9000"
    env_file:
      - .env
    environment:
      # Override Redis URL to use Docker service name
      - REDIS_URL=redis://redis:6379
      # Override Meilisearch URL to use Docker service name
      - MEILISEARCH_HOST=http://meilisearch:7700
      # Bind to all interfaces (required for Docker)
      - HOST=0.0.0.0
      - PORT=9000
      # Development mode
      - NODE_ENV=development
    volumes:
      # Mount entire source code for hot reload (including admin customizations)
      - ./src:/app/src
      - ./medusa-config.ts:/app/medusa-config.ts
      - ./instrumentation.ts:/app/instrumentation.ts
      - ./static:/app/static
      # Prevent overwriting node_modules from host
      - /app/node_modules
    networks:
      - medusa-network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:9000/health",
        ]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

# ============================================
# Networks
# ============================================
networks:
  medusa-network:
    driver: bridge

# ============================================
# Volumes
# ============================================
volumes:
  redis_data:
    driver: local
  meilisearch_data:
    driver: local
